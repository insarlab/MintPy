version: 2.1

executors:
  mintpy:
    docker:
      - image: cimg/base:current
        environment:
          CONDA_PREFIX: /root/tools/miniforge
          MINTPY_HOME: /root/tools/MintPy
        user: root
    working_directory: /root/tools/MintPy
    resource_class: large

commands:
  configure-environment:
    steps:
      - run:
          name: Configure MintPy environment
          command: |
            # BASH_ENV is job-local, so configure it in every job.
            echo 'export PATH=${CONDA_PREFIX}/bin:${PATH}' >> ${BASH_ENV}
            echo 'export PROJ_LIB=${CONDA_PREFIX}/share/proj' >> ${BASH_ENV}
            echo 'export GDAL_DATA=${CONDA_PREFIX}/share/gdal' >> ${BASH_ENV}

jobs:
  unit-tests:
    executor: mintpy
    steps:
      - checkout:
          method: blobless
      - run:
          name: Setting Up Environment with Miniforge
          command: |
            apt update
            apt-get update --yes && apt-get upgrade --yes
            apt-get install --yes git wget
            # install miniforge (https://github.com/conda-forge/miniforge?tab=readme-ov-file#as-part-of-a-ci-pipeline)
            mkdir -p ${HOME}/tools
            cd ${HOME}/tools
            wget -O Miniforge3.sh "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh"
            bash Miniforge3.sh -b -p ${HOME}/tools/miniforge
            source "${HOME}/tools/miniforge/etc/profile.d/conda.sh"
            source "${HOME}/tools/miniforge/etc/profile.d/mamba.sh"

      - configure-environment
      - run:
          name: Installing MintPy
          no_output_timeout: 30m
          command: |
            export PYTHONUNBUFFERED=1
            # install dependencies and source code
            mamba install --verbose --yes --file ${MINTPY_HOME}/requirements.txt gdal libgdal-netcdf pytest
            python -m pip install ${MINTPY_HOME}
            # test installation
            smallbaselineApp.py -h
            tropo_pyaps3.py -h
            solid_earth_tides.py -h

      - run:
          name: Unit Test
          command: |
            ${MINTPY_HOME}/tests/objects/euler_pole.py
            ${MINTPY_HOME}/tests/objects/ionex.py
            ${MINTPY_HOME}/tests/asc_desc2horz_vert.py
            ${MINTPY_HOME}/tests/dem_error.py
            pytest ${MINTPY_HOME}/tests/

      - run:
          name: Remove package download caches before sharing environment
          command: mamba clean --all --yes
      - persist_to_workspace:
          # Preserve absolute installation paths for Conda and pip entry points.
          root: /root/tools
          paths:
            - miniforge
            - MintPy

  integration-test:
    parameters:
      dataset:
        type: enum
        enum:
          - FernandinaSenDT128
          - SanFranSenDT42
          - RidgecrestSenDT71
          - SanFranBaySenD42
          - WellsEnvD2T399
          - WCapeSenAT29
    executor: mintpy
    steps:
      - attach_workspace:
          at: /root/tools
      - configure-environment
      - run:
          name: Install download utility
          command: |
            apt-get update --yes
            apt-get install --yes wget
      - restore_cache:
          keys:
            - mintpy-data-v1-<< parameters.dataset >>-{{ checksum "tests/smallbaselineApp.py" }}
      - run:
          name: Integration Test - << parameters.dataset >>
          no_output_timeout: 30m
          command: |
            mkdir -p ${HOME}/data
            ${MINTPY_HOME}/tests/smallbaselineApp.py --dir ${HOME}/data --dset << parameters.dataset >>
      - save_cache:
          key: mintpy-data-v1-<< parameters.dataset >>-{{ checksum "tests/smallbaselineApp.py" }}
          paths:
            # Cache the original input archive, never generated test outputs.
            - /root/data/<< parameters.dataset >>.tar.xz

  unit-n-workflow-tests:
    executor: mintpy
    steps:
      - run:
          name: All unit and integration tests passed
          command: echo "All unit and integration tests passed."

workflows:
  version: 2
  unit-n-workflow-tests:
    jobs:
      - unit-tests
      - integration-test:
          name: integration-<< matrix.dataset >>
          requires:
            - unit-tests
          matrix:
            parameters:
              dataset:
                - FernandinaSenDT128
                - SanFranSenDT42
                - RidgecrestSenDT71
                - SanFranBaySenD42
                - WellsEnvD2T399
                - WCapeSenAT29
      # Keep the original required status check, after every matrix job passes.
      - unit-n-workflow-tests:
          requires:
            - unit-tests
            - integration-test
